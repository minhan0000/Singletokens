<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · SingleTokens</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('st_theme') || 'dark'; } catch {}</script>
</head>
<body>
<main class="login-page">
  <div class="login-card">
    <div class="sidebar-logo">SingleTokens</div>
    <div class="tabs" role="tablist">
      <button class="tab is-active" role="tab" id="tab-login" aria-selected="true" aria-controls="form">Log in</button>
      <button class="tab" role="tab" id="tab-signup" aria-selected="false" aria-controls="form">Sign up</button>
    </div>

    <form id="form" novalidate>
      <div class="form-error" role="alert" hidden></div>
      <div class="field" data-only="signup" hidden>
        <label class="field-label" for="name">Name</label>
        <input class="input" id="name" autocomplete="name" maxlength="60">
        <div class="field-error" hidden></div>
      </div>
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="email">
        <div class="field-error" hidden></div>
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password">
        <div class="field-note" data-only="signup" hidden>At least 12 characters.</div>
        <div class="field-error" hidden></div>
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="submit" type="submit" style="margin-top:var(--sp-24)">Log in</button>
    </form>
    <p class="login-foot"><a href="/">← Back to the homepage</a></p>
  </div>
</main>

<script type="module">
const MIN_PASSWORD = 12;
const $ = s => document.querySelector(s);
let mode = location.hash === '#signup' ? 'signup' : 'login';

// Already logged in? Go straight to the app.
(async () => {
  const token = localStorage.getItem('st_token');
  if (!token) return;
  try {
    const r = await fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } });
    if (r.ok) location.replace('/app.html');
  } catch {}
})();

function setMode(m) {
  mode = m;
  for (const [id, on] of [['#tab-login', m === 'login'], ['#tab-signup', m === 'signup']]) {
    $(id).classList.toggle('is-active', on);
    $(id).setAttribute('aria-selected', on);
  }
  document.querySelectorAll('[data-only="signup"]').forEach(e => { e.hidden = m !== 'signup'; });
  $('#password').autocomplete = m === 'signup' ? 'new-password' : 'current-password';
  $('#submit').textContent = m === 'signup' ? 'Create account' : 'Log in';
  document.title = (m === 'signup' ? 'Sign up' : 'Log in') + ' · SingleTokens';
  history.replaceState(null, '', m === 'signup' ? '#signup' : location.pathname);
  clearErrors();
  (m === 'signup' ? $('#name') : $('#email')).focus();
}
$('#tab-login').addEventListener('click', () => setMode('login'));
$('#tab-signup').addEventListener('click', () => setMode('signup'));

function fieldError(input, msg) {
  const box = input.closest('.field').querySelector('.field-error');
  input.classList.toggle('is-error', !!msg);
  input.setAttribute('aria-invalid', !!msg);
  box.textContent = msg || '';
  box.hidden = !msg;
}
function formError(msg) { $('.form-error').textContent = msg || ''; $('.form-error').hidden = !msg; }
function clearErrors() { formError(''); ['#name', '#email', '#password'].forEach(s => fieldError($(s), '')); }
['#name', '#email', '#password'].forEach(s => $(s).addEventListener('input', () => fieldError($(s), '')));

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  clearErrors();
  const name = $('#name').value.trim(), email = $('#email').value.trim(), password = $('#password').value;
  const bad = [];
  if (mode === 'signup' && !name) bad.push(['#name', 'Enter your name.']);
  if (!/^\S+@\S+\.\S+$/.test(email)) bad.push(['#email', 'Enter a valid email address.']);
  if (!password) bad.push(['#password', 'Enter your password.']);
  else if (mode === 'signup' && password.length < MIN_PASSWORD) bad.push(['#password', `Password must be at least ${MIN_PASSWORD} characters.`]);
  if (bad.length) { bad.forEach(([s, m]) => fieldError($(s), m)); $(bad[0][0]).focus(); return; }

  const btn = $('#submit'), label = btn.textContent;
  btn.disabled = true;
  btn.textContent = mode === 'signup' ? 'Creating account…' : 'Logging in…';
  try {
    const r = await fetch(mode === 'signup' ? '/api/auth/register' : '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(mode === 'signup' ? { name, email, password } : { email, password }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Something went wrong. Try again.');
    localStorage.setItem('st_token', data.token);
    localStorage.setItem('st_user', JSON.stringify(data.user));
    location.replace('/app.html');
  } catch (err) {
    formError(err.message === 'Failed to fetch' ? 'Server unreachable. Try again in a moment.' : err.message);
    btn.disabled = false;
    btn.textContent = label;
  }
});

setMode(mode);
</script>
</body>
</html>
